appId: sh.potion.loadout
productName: Loadout
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: ../../packages/cli/dist/loadout.mjs
    to: cli/loadout.mjs
  - from: resources
    to: resources
asar: true
extraMetadata:
  homepage: https://loadout.potion.sh
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  category: Development
  # Otherwise derived from the package name `@loadout/desktop`, which is not a valid file name.
  executableName: loadout
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
deb:
  packageName: loadout
  artifactName: loadout_${version}_${arch}.${ext}
publish: null
