appId: sh.potion.loadout
productName: Loadout
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: ../../packages/cli/dist/loadout.mjs
    to: cli/loadout.mjs
  - from: resources
    to: resources
asar: true
# Electron's build-time switches. Checked on a macOS build; Windows and Linux use the same ones.
electronFuses:
  # The published CLI runs on the app's own runtime through ELECTRON_RUN_AS_NODE: must stay on.
  runAsNode: true
  # NODE_EXTRA_CA_CERTS reaches the CLI through this switch: behind a company proxy that
  # inspects TLS, the CLI needs it. With runAsNode on, turning it off would not stop anything.
  enableNodeOptionsEnvironmentVariable: true
  # No debugger can be attached to the installed app with --inspect.
  enableNodeCliInspectArguments: false
  # Cookies on disk are encrypted with the OS key store, like Chrome's.
  enableCookieEncryption: true
  # The app's code is only read from app.asar, and only when it matches the hash signed into
  # the app: an edited app.asar does not start.
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # The window is loaded from file://, which needs its usual access to its own files.
  grantFileProtocolExtraPrivileges: true
extraMetadata:
  homepage: https://loadout.potion.sh
# File names are read by scripts/update-feed.mjs to build the update feed: change both together.
# The landing page's download links take the .dmg next to each mac .zip (apps/landing/src/lib/downloads.ts).
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Ad-hoc signature ("-"): no Apple certificate, but a complete, valid signature. Without one,
  # macOS calls a downloaded app "damaged" instead of letting the user open it anyway, and the
  # updater could not check the download's integrity.
  identity: "-"
  # The hardened runtime only matters for notarisation, which needs a real certificate. With an
  # ad-hoc signature it would stop the app loading its own frameworks.
  hardenedRuntime: false
  artifactName: Loadout-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: Loadout-Setup-${version}-${arch}.${ext}
linux:
  category: Development
  # Otherwise derived from the package name `@loadout/desktop`, which is not a valid file name.
  executableName: loadout
  # Required by the .deb build and printed in every package. A GitHub no-reply address keeps a
  # personal e-mail out of the public installers.
  maintainer: Pankaj <antick@users.noreply.github.com>
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
appImage:
  artifactName: Loadout-${version}-${arch}.${ext}
deb:
  packageName: loadout
  artifactName: loadout_${version}_${arch}.${ext}
publish: null
