name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # File handling (links, junctions, copies, locks, line endings, path separators) differs
        # on each, so every one runs the full check.
        # Ubuntu is pinned: `ubuntu-latest` moves to a new release on its own, which changes the
        # build without a commit here. Move this by hand when the time comes.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      # Tests make Git commits; name them without touching the runner's Git config.
      GIT_AUTHOR_NAME: Loadout CI
      GIT_AUTHOR_EMAIL: ci@loadout.invalid
      GIT_COMMITTER_NAME: Loadout CI
      GIT_COMMITTER_EMAIL: ci@loadout.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, format, typecheck and test
        run: pnpm check
