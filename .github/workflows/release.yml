name: Release builds

# Builds installers for every platform, writes the update feed (latest.json) and collects them
# in a draft release, with a signed build provenance attestation for every file. Only a pushed
# tag that matches the app version starts it (v0.1.0 for version 0.1.0), so every release is
# built from the tagged commit. Nothing reaches users until the draft is published by hand: the
# app's update check only sees the newest published release. Publishing it also publishes the
# CLI to npm (publish-npm.yml).
#
# macOS artifacts are signed, notarized and checked before uploading. Windows remains paused.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Check the tagged commit
    uses: ./.github/workflows/ci.yml

  version:
    name: Read the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Match the tag to the app version
        id: version
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the app version ${version} (expected ${tag})."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [version, quality]
    environment: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Mac builds both Apple Silicon and Intel: the app has no native modules.
          - name: macOS
            os: macos-26
            args: --mac --arm64 --x64
            standalone_cli: true
          - name: Linux
            os: ubuntu-24.04
            args: --linux
            standalone_cli: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node and the dependencies
        uses: ./.github/actions/setup

      # The app and what it bundles (the CLI); the landing page is Vercel's to build.
      - name: Build the CLI and the app
        run: pnpm exec turbo run build --filter=@loadout/desktop...

      - name: Prepare temporary Apple signing keychain
        if: matrix.name == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: node scripts/release/macos.mjs prepare

      - name: Package installers
        working-directory: apps/desktop
        run: pnpm exec electron-builder --config electron-builder.release.yml ${{ matrix.args }} --publish never

      - name: Verify macOS installers and notarize disk images
        if: matrix.name == 'macOS'
        run: node scripts/release/macos.mjs verify

      - name: Build standalone CLI executables
        if: matrix.standalone_cli
        run: pnpm --filter @loadout/cli run build:standalone -- --all

      - name: Sign and notarize the macOS CLI
        if: matrix.standalone_cli
        run: node scripts/release/macos.mjs cli

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

      - name: Upload standalone CLI
        if: matrix.standalone_cli
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-standalone
          if-no-files-found: error
          path: packages/cli/dist/standalone/*

      - name: Remove signing credentials
        if: always() && matrix.name == 'macOS'
        run: node scripts/release/macos.mjs cleanup

  release:
    name: Draft release
    needs: [version, build]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # Build provenance: signed with this workflow's identity, stored by GitHub.
      id-token: write
      attestations: write
    steps:
      - name: Checkout (feed script and commit history for the notes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download every build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Write the update feed
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          node apps/desktop/scripts/update-feed.mjs dist \
            --version "${TAG#v}" --repo "$GITHUB_REPOSITORY" \
            --require darwin-arm64 --require darwin-x64 \
            --require linux-x64-appimage --require linux-arm64-appimage \
            --require linux-x64-deb --require linux-arm64-deb

      - name: Sign the update feed
        env:
          # The private half of UPDATE_FEED_PUBLIC_KEY; installed apps ignore an unsigned feed.
          UPDATE_FEED_SIGNING_KEY: ${{ secrets.UPDATE_FEED_SIGNING_KEY }}
        run: node apps/desktop/scripts/sign-feed.mjs dist/latest.json

      - name: Attest where every file was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Write the release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          # An @word in a commit subject (owner/repo@skill, @antick/loadout) would mention a
          # GitHub user and list them as a contributor; in backticks it is plain text.
          changes() {
            git log --no-merges --format='%s' "${previous}..${GITHUB_SHA}" \
              | sed -nE "s/^$1(\([^)]*\))?!?: (.*)$/- \2/p" \
              | sed -E 's/(^|[^`[:alnum:]/])(@[[:alnum:]][[:alnum:]._/-]*)/\1`\2`/g'
          }
          {
            echo "Which file to download and what to click the first time: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md"
            echo
            echo "Already using Loadout? It updates itself: Settings → About → Check for updates."
            if [ -z "$previous" ]; then
              echo
              echo "First public release."
            else
              features="$(changes feat)"
              fixes="$(changes fix)"
              if [ -n "$features" ]; then printf '\n## New\n\n%s\n' "$features"; fi
              if [ -n "$fixes" ]; then printf '\n## Fixed\n\n%s\n' "$fixes"; fi
            fi
          } > notes.md
          cat notes.md

      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A published release is what installed apps update to: never swap its files, not
            # even from a re-run or a tag of the same version pushed again on another commit.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::${TAG} is already published. Bump the version to release again."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* \
              --draft --target "$GITHUB_SHA" \
              --title "Loadout ${TAG#v}" --notes-file notes.md
          fi
