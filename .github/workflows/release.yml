name: Release builds

# Builds installers for every platform, writes the update feed (latest.json) and collects them
# in a draft release. Start it by pushing a tag that matches the app version (v0.1.0 for version
# 0.1.0), or by hand from the Actions tab. Nothing reaches users until the draft is published by
# hand: the app's update check only sees the newest published release.
#
# The builds are not signed with an Apple or Windows certificate: macOS asks to confirm the first
# launch, Windows SmartScreen warns. docs/INSTALL.md tells users what to click.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # No signing certificate is configured; do not let electron-builder look for one. macOS builds
  # still get an ad-hoc signature (`identity: "-"` in electron-builder.yml).
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Match the tag to the app version
        id: version
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the app version ${version} (expected ${tag})."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Mac builds both Apple Silicon and Intel: the app has no native modules.
          - name: macOS
            os: macos-latest
            args: --mac --arm64 --x64
            standalone_cli: true
          - name: Linux
            os: ubuntu-latest
            args: --linux
            standalone_cli: false
          - name: Windows
            os: windows-latest
            args: --win --x64
            standalone_cli: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the CLI and the app
        run: pnpm build

      - name: Package installers
        working-directory: apps/desktop
        run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.args }} --publish never

      - name: Build standalone CLI executables
        if: matrix.standalone_cli
        run: pnpm --filter @loadout/cli run build:standalone -- --all

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

      - name: Upload standalone CLI
        if: matrix.standalone_cli
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-standalone
          if-no-files-found: error
          path: packages/cli/dist/standalone/*

  release:
    name: Draft release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (feed script and commit history for the notes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download every build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Write the update feed
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          node apps/desktop/scripts/update-feed.mjs dist \
            --version "${TAG#v}" --repo "$GITHUB_REPOSITORY" \
            --require darwin-arm64 --require darwin-x64 --require win32-x64 \
            --require linux-x64-appimage --require linux-arm64-appimage \
            --require linux-x64-deb --require linux-arm64-deb

      - name: Write the release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          changes() {
            git log --no-merges --format='%s' "${previous}..${GITHUB_SHA}" \
              | sed -nE "s/^$1(\([^)]*\))?!?: (.*)$/- \2/p"
          }
          {
            echo "Which file to download and what to click the first time: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md"
            echo
            echo "Already using Loadout? It updates itself: Settings → About → Check for updates."
            if [ -z "$previous" ]; then
              echo
              echo "First public release."
            else
              features="$(changes feat)"
              fixes="$(changes fix)"
              if [ -n "$features" ]; then printf '\n## New\n\n%s\n' "$features"; fi
              if [ -n "$fixes" ]; then printf '\n## Fixed\n\n%s\n' "$fixes"; fi
            fi
          } > notes.md
          cat notes.md

      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* \
              --draft --target "$GITHUB_SHA" \
              --title "Loadout ${TAG#v}" --notes-file notes.md
          fi
