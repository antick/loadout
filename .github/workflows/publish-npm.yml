name: Publish the CLI to npm

# Publishing a GitHub release (the draft that release.yml leaves) publishes the CLI of that tag
# as @antick/loadout. No npm token is stored anywhere: npm trusts this workflow file through
# trusted publishing (OIDC), and the package gets a provenance statement that ties it to the
# tagged commit and this run. A failed run can be re-run from the Actions tab.

on:
  release:
    types: [published]

concurrency:
  group: publish-npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish @antick/loadout
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted publishing and provenance: npm checks this workflow's signed identity.
      id-token: write
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up pnpm, Node and the dependencies
        uses: ./.github/actions/setup

      - name: Build the npm package
        run: pnpm --filter @loadout/cli run pack:npm

      - name: Match the package to the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node packages/cli/dist/npm/loadout.mjs --version)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::The CLI says ${version}, but the release is ${TAG}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # npm never takes a version twice: a re-run after a successful publish has nothing to do.
          if pnpm view "@antick/loadout@${version}" version > /dev/null 2>&1; then
            echo "::notice::@antick/loadout ${version} is already on npm."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.version.outputs.published != 'true'
        working-directory: packages/cli/dist/npm
        run: pnpm publish --access public --no-git-checks --provenance
