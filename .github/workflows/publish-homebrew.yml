name: Publish to Homebrew

# Deferred: the tap is not set up yet, so this runs only by hand (Actions tab, "Run workflow",
# with the tag of a published release). It writes the Homebrew formula (the command-line tool)
# and cask (the desktop app) for that release with scripts/homebrew.mjs, and pushes them to the
# tap repository. Then:
#
#   brew install antick/tap/loadout           the CLI, with Bash and Zsh completion
#   brew install --cask antick/tap/loadout    the app
#
# Pushing to the tap needs a HOMEBREW_TAP_TOKEN secret: a fine-grained token with Contents read
# and write on the tap repository only. Without it the run says so and stops; nothing else waits
# on it. A failed run can be re-run from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the published release, like v0.3.0"
        required: true
        type: string

concurrency:
  group: publish-homebrew-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAP_REPO: antick/homebrew-tap

jobs:
  publish:
    name: Update the Homebrew tap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check for the tap token
        id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::No HOMEBREW_TAP_TOKEN secret, so the Homebrew tap was not updated."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the released tag
        if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Checkout the tap
        if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Set up Node
        if: steps.token.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download the release files
        if: steps.token.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern 'loadout-cli-*-darwin-*' --pattern 'loadout-cli-*-linux-*' \
            --pattern 'Loadout-*-mac-*.dmg'

      - name: Write the formula and the cask
        if: steps.token.outputs.skip != 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/homebrew.mjs --version "$TAG" --assets assets --out tap

      - name: Push to the tap
        if: steps.token.outputs.skip != 'true'
        env:
          TAG: ${{ inputs.tag }}
        working-directory: tap
        run: |
          git add Formula Casks
          if git diff --cached --quiet; then
            echo "::notice::The tap already has ${TAG}."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "loadout ${TAG#v}"
          git push
