name: Vercel production

# Production deploys to Vercel only when a stable GitHub Release is published.
# Native Vercel Git deployments are off in vercel.json (git.deploymentEnabled: false),
# so PRs, branch pushes and merges to main do not deploy. Builds still run on Vercel
# with each project's existing settings (Root Directory, install and build commands).
# workflow_dispatch redeploys the latest stable release by hand.
# Required secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${EVENT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          test -n "$tag" || { echo "No stable release found." >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.rel.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          true
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            test -n "${!v:-}" || { echo "Missing secret for $v" >&2; exit 1; }
          done
          export VERCEL_PROJECT_ID
          npx --yes vercel@64.2.0 deploy --prod --yes --token "$VERCEL_TOKEN"
