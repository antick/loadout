name: Set up pnpm, Node and the dependencies
description: The pnpm version from package.json, Node 22 with the pnpm store cached, then a frozen install.

runs:
  using: composite
  steps:
    - name: Set up pnpm (version from package.json)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
